<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>코인 시부레 — 시안 B 나이트 플로어</title>
<link rel="icon" href="assets/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="assets/favicon.png">
<meta name="theme-color" content="#0b0d0f">
<meta name="description" content="하이퍼리퀴드 비트코인·이더리움 시세를 빗썸 테더 환율로 바꿔 큰 전광판에 띄우는 3D 객장.">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: full-bleed 3D brokerage floor (객장) facing one big LED board; glass HUD pills on top, chat bar at the bottom.
   The room is a bright white-toned floor; the HUD keeps its dark glass look over it. */
:root{
  color-scheme: dark;
  --bg:#0b0d10;
  --glass:rgba(15,17,21,.76);
  --line:rgba(255,255,255,.1);
  --text:#edf0f4;
  --muted:#8f97a5;
  --led:#ffb547;
  --up:#ff4d57;
  --down:#3f8cff;
  --live:#3ad07a;
  --err:#ff8a7a;
  --vignette:rgba(0,0,0,.55);
  --brand-glyph:"◆";
  --font-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-led:"DotGothic16",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 var(--font-ui);overflow:hidden;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
#app{position:fixed;inset:0;background:var(--bg)}
#scene{display:block;width:100%;height:100%;touch-action:none;cursor:grab;outline:none}
#scene.dragging{cursor:grabbing}

.hud-top{position:absolute;top:0;left:0;right:0;display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:8px;
  padding-top:calc(12px + env(safe-area-inset-top,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.pill{pointer-events:auto;display:flex;align-items:center;gap:10px;min-height:40px;padding:6px 14px;border:1px solid var(--line);border-radius:999px;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.brand{padding-left:5px}
/* exit back to korulive.com, inside the chip on its left like 산사's 나가기 */
.exit{display:flex;align-items:center;justify-content:center;width:30px;height:30px;margin-right:-2px;border-radius:50%;color:var(--text);text-decoration:none;flex:none;transition:background .15s ease}
.exit:hover{background:rgba(236,231,220,.1)}
.exit:focus-visible{outline:2px solid var(--led);outline-offset:1px}
.exit svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.brand .mark{font-weight:700;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
.brand .count{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.dot.live{background:var(--live);box-shadow:0 0 0 3px rgba(58,208,122,.18)}
.right{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end;min-width:0}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--muted)}
.avg-btn{appearance:none;font:inherit;font-size:13px;font-weight:600;color:var(--text);cursor:pointer;gap:7px;white-space:nowrap}
.avg-btn svg{width:16px;height:16px;fill:none;stroke:var(--led);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.avg-btn:hover{border-color:rgba(255,181,71,.45)}
.avg-btn:focus-visible{outline:2px solid var(--led);outline-offset:2px}
.avg-btn[aria-expanded="true"]{border-color:var(--led)}

.avg-panel{position:absolute;top:calc(62px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));width:min(300px,calc(100vw - 32px));padding:16px;
  border:1px solid var(--line);border-radius:18px;background:rgba(13,15,17,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 14px 40px rgba(0,0,0,.5)}
.avg-title{margin:0 0 10px;font-weight:700;font-size:15px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:12px;background:rgba(236,231,220,.07)}
.seg label{position:relative;display:block}
.seg input{position:absolute;inset:0;margin:0;opacity:0;cursor:pointer}
.seg span{display:block;text-align:center;padding:9px 6px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted);transition:background .15s ease,color .15s ease}
.seg input:checked + span{background:var(--text);color:#16140f}
.seg input:focus-visible + span{outline:2px solid var(--led);outline-offset:1px}
.avg-field{display:flex;align-items:center;gap:6px;margin-top:10px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:rgba(0,0,0,.28);cursor:text}
.avg-field:focus-within{border-color:var(--led)}
.avg-field input{flex:1;min-width:0;border:0;background:transparent;color:var(--text);font:600 18px var(--font-ui);padding:11px 0;outline:none;font-variant-numeric:tabular-nums}
.avg-field input::placeholder{color:var(--muted);font-weight:500}
.avg-field span{color:var(--muted);font-size:14px}
.avg-hint{margin:8px 2px 0;font-size:12px;line-height:1.5;color:var(--muted)}
.avg-hint.err{color:var(--err)}
.avg-actions{display:flex;gap:8px;margin-top:12px}
.avg-actions button{flex:1;appearance:none;border:0;border-radius:12px;padding:11px 10px;font:600 14px var(--font-ui);cursor:pointer}
.avg-actions button:focus-visible{outline:2px solid var(--led);outline-offset:2px}
.avg-actions .primary{background:var(--led);color:#1a1206}
.avg-actions .ghost{background:rgba(236,231,220,.08);color:var(--text)}

.hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));margin:0;font-size:13px;color:var(--text);
  background:rgba(13,15,17,.66);padding:7px 14px;border-radius:999px;white-space:nowrap;pointer-events:none;transition:opacity .8s ease}
.hint.gone{opacity:0}

/* chat bar at the bottom: what you type pops up over your ant for a few seconds */
.chatbar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(560px,calc(100vw - 32px));display:flex;align-items:center;gap:6px;padding:5px 5px 5px 16px;border:1px solid var(--line);border-radius:999px;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:border-color .15s ease}
.chatbar:focus-within{border-color:rgba(255,181,71,.55)}
.chatbar input{flex:1;min-width:0;border:0;background:transparent;color:var(--text);font:500 16px var(--font-ui);padding:8px 0;outline:none}
.chatbar input::placeholder{color:var(--muted)}
.chatbar input:disabled{cursor:default}
.chatbar button{flex:none;appearance:none;border:0;width:38px;height:38px;border-radius:50%;background:var(--led);color:#1a1206;display:flex;align-items:center;justify-content:center;cursor:pointer}
.chatbar button:disabled{background:rgba(236,231,220,.1);color:var(--muted);cursor:default}
.chatbar button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.chatbar button:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom,0px));margin:0;width:max-content;max-width:calc(100vw - 32px);padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:rgba(12,14,16,.9);color:var(--text);font-size:13px;line-height:1.45;text-align:center;word-break:keep-all;pointer-events:none}
/* tap someone's ant: report them (their words disappear from my screen for good) */
.peer-card{position:absolute;top:calc(62px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:min(320px,calc(100vw - 32px));padding:16px;border:1px solid var(--line);border-radius:18px;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.peer-name{margin:0 0 6px;font-weight:700;font-size:15px}
.peer-note{margin:0 0 14px;font-size:12.5px;line-height:1.55;color:var(--muted);white-space:pre-line;word-break:keep-all}
.peer-actions{display:flex;gap:8px}
.peer-actions button{flex:1;appearance:none;border:0;border-radius:12px;padding:11px 10px;font:600 14px var(--font-ui);cursor:pointer}
.peer-actions .ghost{background:rgba(236,231,220,.08);color:var(--text)}
.peer-actions .danger{background:var(--err);color:#1f0805}
.peer-actions button:focus-visible{outline:2px solid var(--led);outline-offset:2px}
.fail{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding-inline:max(16px,env(safe-area-inset-left,0px));font-size:15px;color:var(--muted);line-height:1.6}
/* 정원(100명)이 다 찼을 때: 객장 대신 이 안내만 보이고, 자리가 나면 저절로 들어감 */
.gate{position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-left,0px));background:var(--bg)}
.gate-card{width:min(340px,100%);padding:26px 22px 20px;border:1px solid var(--line);border-radius:20px;background:var(--glass);text-align:center}
.gate-title{margin:0 0 8px;font-size:19px;font-weight:700;letter-spacing:-.01em;word-break:keep-all}
.gate-text{margin:0 0 20px;font-size:14px;line-height:1.65;color:var(--muted);white-space:pre-line;word-break:keep-all}
.gate-exit{display:block;padding:12px 10px;border-radius:12px;background:var(--led);color:#1a1206;font-weight:600;text-decoration:none}
.gate-exit:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* phones: smaller HUD so more of the floor stays tappable */
@media (max-width:560px){
  .hud-top{padding-top:calc(8px + env(safe-area-inset-top,0px));gap:6px}
  .pill{min-height:32px;padding:4px 11px;gap:7px}
  .brand{padding-left:4px}
  .exit{width:26px;height:26px}
  .exit svg{width:16px;height:16px}
  .brand .mark{font-size:13px}
  .brand .count{font-size:11.5px;gap:5px}
  .dot{width:6px;height:6px}
  .avg-btn{font-size:12px;gap:5px}
  .avg-btn svg{width:13px;height:13px}
  .avg-panel{top:calc(48px + env(safe-area-inset-top,0px))}
  .chatbar{bottom:calc(8px + env(safe-area-inset-bottom,0px));padding:4px 4px 4px 14px}
  .chatbar button{width:34px;height:34px}
  .toast{bottom:calc(60px + env(safe-area-inset-bottom,0px));font-size:12px}
  .peer-card{top:calc(48px + env(safe-area-inset-top,0px))}
  .hint{bottom:calc(62px + env(safe-area-inset-bottom,0px));font-size:11.5px;padding:5px 11px}
}
@media (prefers-reduced-motion:reduce){ .hint,.chatbar,.seg span,.exit{transition:none} }
/* polish: a soft vignette over the room, deeper glass on the HUD, a brand glyph */
#app::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse 75% 70% at 50% 45%,rgba(0,0,0,0) 50%,var(--vignette) 100%)}
.hud-top,.avg-panel,.hint,.chatbar,.toast,.peer-card,.gate,.fail{z-index:2}
.pill{box-shadow:0 10px 28px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.07)}
.brand .mark{font-size:16px;letter-spacing:-.02em;display:flex;align-items:center;gap:7px}
.brand .mark::before{content:var(--brand-glyph);font-size:13px;color:var(--led);line-height:1}
.chatbar{box-shadow:0 12px 32px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.07)}
.hint{border:1px solid var(--line)}
.avg-panel,.peer-card{box-shadow:0 18px 48px rgba(0,0,0,.55)}
</style>
</head>
<body>
<div id="app">
  <canvas id="scene" tabindex="0" aria-label="코인 시부레 3D 화면. 앞쪽 전광판에 비트코인과 이더리움 1분봉 차트가 원화로 나옵니다. 바닥을 누르면 이동하고, 의자를 누르면 앉습니다."></canvas>

  <header class="hud-top">
    <div class="pill brand">
      <a class="exit" href="https://korulive.com/" aria-label="코루라이브로 돌아가기" title="코루라이브로 돌아가기">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h3.5A2.5 2.5 0 0 1 20 6.5v11a2.5 2.5 0 0 1-2.5 2.5H14"/><path d="M15 12H4"/><path d="M8 7.5 3.5 12 8 16.5"/></svg>
      </a>
      <span class="mark">코인 시부레</span>
      <span class="count"><span class="dot" id="dot"></span><span id="count">연결 중</span></span>
    </div>
    <div class="right">
      <button type="button" class="pill avg-btn" id="avgBtn" aria-haspopup="dialog" aria-expanded="false" aria-controls="avgPanel">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg><span id="avgBtnText">평단 입력</span>
      </button>
    </div>
  </header>

  <div class="avg-panel" id="avgPanel" role="dialog" aria-labelledby="avgTitle" hidden>
    <form id="avgForm" novalidate>
      <p class="avg-title" id="avgTitle">내 평단</p>
      <div class="seg" role="radiogroup" aria-label="종목">
        <label><input type="radio" name="avgStock" value="BTC" id="avgBTC" checked><span>비트코인</span></label>
        <label><input type="radio" name="avgStock" value="ETH" id="avgETH"><span>이더리움</span></label>
      </div>
      <label class="avg-field" for="avgPrice"><input id="avgPrice" name="avgPrice" inputmode="numeric" autocomplete="off" enterkeyhint="done" aria-describedby="avgHint"><span>원</span></label>
      <p class="avg-hint" id="avgHint" aria-live="polite">만 원 단위 층으로 바꿔서 이름 위에 표시돼요. 150,000,000원이면 "비트 15,000층"이에요.</p>
      <div class="avg-actions">
        <button type="button" class="ghost" id="avgClear">지우기</button>
        <button type="submit" class="primary" id="avgSave">표시하기</button>
      </div>
    </form>
  </div>

  <p class="hint" id="hint">바닥을 눌러 이동 · 의자를 눌러 앉기 · 드래그로 둘러보기</p>

  <form class="chatbar" id="chatBar" autocomplete="off">
    <input id="chatInput" maxlength="80" enterkeyhint="send" placeholder="연결되면 쓸 수 있어요" aria-label="채팅 (Enter)" disabled>
    <button type="submit" id="chatSend" aria-label="보내기" title="보내기" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13"/><path d="M13 6.5 18.5 12 13 17.5"/></svg>
    </button>
  </form>
  <p class="toast" id="toast" role="status" aria-live="polite" hidden></p>

  <div class="peer-card" id="peerCard" role="dialog" aria-labelledby="peerName" hidden>
    <p class="peer-name" id="peerName"></p>
    <p class="peer-note" id="peerNote"></p>
    <div class="peer-actions">
      <button type="button" class="ghost" id="peerClose">닫기</button>
      <button type="button" class="danger" id="peerBlock">차단하기</button>
    </div>
  </div>

  <div class="gate" id="gate" hidden>
    <div class="gate-card" role="status" aria-live="polite">
      <p class="gate-title" id="gateTitle">객장이 꽉 찼어요</p>
      <p class="gate-text" id="gateText"></p>
      <a class="gate-exit" href="https://korulive.com/">코루라이브로 돌아가기</a>
    </div>
  </div>
  <div class="fail" id="fail" hidden><p>3D 화면을 불러오지 못했어요.<br>브라우저 설정에서 하드웨어 가속(WebGL)이 켜져 있는지 확인해 주세요.</p></div>
  <p class="sr-only" id="sr"></p>
</div>

<script src="vendor/three.min.js"></script>
<script>
(function(){
'use strict';
const $ = s => document.querySelector(s);
const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ------------------------------------------------------------------
   Market data, computed exactly like korulive.com's cards:
   - korulive anchor, every 60 s (its cron runs once a minute, CDN cached)
   - Hyperliquid metaAndAssetCtxs (main perps), every 10 s: markPx and prevDayPx of BTC, ETH
   - Upbit ticker (KRW-BTC, KRW-ETH, KRW-USDT), every 10 s: domestic won prices for the tape and 김프
   - Hyperliquid candleSnapshot 1m, every 60 s (the live candle follows each 10 s mark in between)
   FX (환율)  = usdtKrwLive × usdKrwAnchor / usdtKrwAnchor   (korulive's synthetic rate)
   Coin won   = markPx × FX;  change = (markPx / prevDayPx - 1) × 100  (vs 24 h ago)
   김프       = Upbit won price / (Hyperliquid markPx × usdKrwAnchor) - 1
   ------------------------------------------------------------------ */
const STOCKS = [
  { code: 'BTC', short: '비트', coin: 'BTC', name: '비트코인', pair: 'BTC/USDC', mark: null, prev: null, candles: [] },
  { code: 'ETH', short: '이더', coin: 'ETH', name: '이더리움', pair: 'ETH/USDC', mark: null, prev: null, candles: [] },
];
const STOCK_BY = { BTC: STOCKS[0], ETH: STOCKS[1] };
function hasOwn(o, k){ return typeof k === 'string' && Object.prototype.hasOwnProperty.call(o, k); }
const AVG_MAX = 1e9;
// a 평단 is { s: 'BTC' | 'ETH', p: won }; anything else is ignored
function cleanAvg(a){
  return a && typeof a === 'object' && hasOwn(STOCK_BY, a.s) && Number.isInteger(a.p) && a.p >= 1e4 && a.p <= AVG_MAX ? { s: a.s, p: a.p } : null;
}
const HL_INFO = 'https://api.hyperliquid.xyz/info';
const KORU_ANCHOR = 'https://api.korulive.com/anchor';
const UPBIT = 'https://api.upbit.com/v1/ticker?markets=KRW-BTC,KRW-ETH,KRW-USDT';
const UP_KEYS = ['BTC', 'ETH', 'USDT'];
const POLL_MS = 10000, ANCHOR_MS = 60000, CANDLE_MS = 60000, CANDLE_INT = 60000, CANDLE_SPAN = 75;
const KST = 9 * 3600 * 1000;

const M = { usdt: null, usdKrw: null, anchor: null, hlAt: 0, anchorAt: 0, started: Date.now(), dirty: true };
// Upbit won prices: { p, pct (24h, signed) } per coin
const U = { BTC: null, ETH: null, USDT: null, at: 0 };
function markDirty(){ M.dirty = true; }
function numOrNull(v){ const x = parseFloat(v); return isFinite(x) ? x : null; }
function parseCandle(c){
  if (!c || typeof c.t !== 'number') return null;
  const o = +c.o, h = +c.h, l = +c.l, cl = +c.c, v = +c.v;
  if (!(o > 0 && h > 0 && l > 0 && cl > 0)) return null;
  return { t: c.t, o, h, l, c: cl, v: isFinite(v) ? v : 0 };
}
// every request gives up after 8 s, so a stalled network can't leave requests piling up
async function getJSON(url, opts){
  const ac = typeof AbortController === 'function' ? new AbortController() : null;
  const timer = ac ? setTimeout(() => ac.abort(), 8000) : 0;
  try {
    const r = await fetch(url, Object.assign({ cache: 'no-store' }, opts, ac ? { signal: ac.signal } : null));
    if (!r.ok) throw new Error(url + ' HTTP ' + r.status);
    return await r.json();
  } finally { clearTimeout(timer); }
}
function hlPost(body){
  return getJSON(HL_INFO, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
}
// at most one request of each kind in flight, so a slow, late answer can't overwrite a newer one
const inFlight = {};
async function once(kind, fn){
  if (inFlight[kind]) return;
  inFlight[kind] = true;
  try { await fn(); } finally { inFlight[kind] = false; }
}
// 1-minute candles
async function pollCandles(){
  const now = Date.now();
  await Promise.all(STOCKS.map(async s => {
    try {
      const d = await hlPost({ type: 'candleSnapshot', req: { coin: s.coin, interval: '1m', startTime: now - CANDLE_SPAN * CANDLE_INT, endTime: now } });
      if (Array.isArray(d)){ s.candles = d.map(parseCandle).filter(Boolean).sort((a, b) => a.t - b.t); liveCandle(s); markDirty(); }
    } catch (e) {}
  }));
}
// move the current minute's candle with the latest price, opening a new one when the minute rolls over
function liveCandle(s){
  const px = s.mark;
  if (px == null || !s.candles.length) return;
  const t = Math.floor(Date.now() / CANDLE_INT) * CANDLE_INT;
  const last = s.candles[s.candles.length - 1];
  if (last.t < t){
    s.candles.push({ t, o: last.c, h: Math.max(last.c, px), l: Math.min(last.c, px), c: px, v: 0 });

function signTexture(text, w, h, font, color, bg){
  const c = document.createElement('canvas'); c.width = w * HD; c.height = h * HD;
  const x = c.getContext('2d'); x.setTransform(HD, 0, 0, HD, 0, 0); x.fillStyle = bg; x.fillRect(0, 0, w, h);
  x.font = font; x.fillStyle = color; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(text, w / 2, h / 2 + 4);
  return canvasTex(c);
}
// two centered lines at the largest size where the longer one still fits the width, in a banner style
function twoLineSign(lines, w, h, st){
  const c = document.createElement('canvas'); c.width = w * HD; c.height = h * HD;
  const x = c.getContext('2d'); x.setTransform(HD, 0, 0, HD, 0, 0); x.fillStyle = st.bg; x.fillRect(0, 0, w, h);
  if (st.border){ x.strokeStyle = st.border; x.lineWidth = 10; x.strokeRect(22, 22, w - 44, h - 44); }
  if (st.rule){ x.fillStyle = st.rule; x.fillRect(60, h - 36, w - 120, 4); }
  let fs = 140; x.font = '700 ' + fs + 'px ' + UI;
  while (fs > 40 && Math.max(...lines.map(l => x.measureText(l).width)) > w - 150){ fs -= 2; x.font = '700 ' + fs + 'px ' + UI; }
  x.fillStyle = st.color; x.textAlign = 'center'; x.textBaseline = 'middle';
  const gap = fs * 1.3;
  lines.forEach((l, i) => x.fillText(l, w / 2, h / 2 + (i - (lines.length - 1) / 2) * gap + 2));
  return canvasTex(c);
}
// a plaque sized to its text, in the same look as the side-wall notice
function fittedSign(text, font, color, bg, planeH, maxW){
  const m = document.createElement('canvas').getContext('2d'); m.font = font;
  const cw = Math.ceil(m.measureText(text).width + 160), ch = 200;
  let w = planeH * cw / ch, h = planeH;
  if (w > maxW){ h *= maxW / w; w = maxW; }
  return new T.Mesh(new T.PlaneGeometry(w, h), new T.MeshBasicMaterial({ map: signTexture(text, cw, ch, font, color, bg) }));
}

// a torso as one smooth lathe surface through [radius, height] pairs: no stacked balls, so no ridges between chest, belly and hem
function torso(prof, mat, zs){
  const curve = new T.CatmullRomCurve3(prof.map(q => new T.Vector3(q[0], q[1], 0)), false, 'catmullrom', 0.5);
  const pts = curve.getPoints(48).map(q => new T.Vector2(Math.max(0.001, q.x), q.y));
  const m = new T.Mesh(new T.LatheGeometry(pts, 40), mat); m.scale.z = zs; m.userData.pts = pts; m.userData.zs = zs;
  return m;
}
// front surface z of a torso at height y (for buttons, pockets, logos)
function frontZ(t, y){
  const pts = t.userData.pts;
  for (let i = 1; i < pts.length; i++) if (pts[i].y >= y){ const a = pts[i - 1], b = pts[i], k = (y - a.y) / Math.max(1e-6, b.y - a.y); return (a.x + (b.x - a.x) * k) * t.userData.zs; }
  return 0;
}
// a unit sphere pushed through a per-vertex shaping function (UVs stay equirectangular, so a face canvas still wraps it)
function shaped(fn, wseg, hseg){
  const g = new T.SphereGeometry(1, wseg || 36, hseg || 28), a = g.attributes.position, v = new T.Vector3();
  for (let i = 0; i < a.count; i++){ v.fromBufferAttribute(a, i); fn(v); a.setXYZ(i, v.x, v.y, v.z); }
  g.computeVertexNormals();
  return g;
}
// superellipsoid rounding: n = 2 is the sphere, larger n squares the shape off
function squarify(v, n){
  const s = Math.pow(Math.pow(Math.abs(v.x), n) + Math.pow(Math.abs(v.y), n) + Math.pow(Math.abs(v.z), n), 1 / n);
  v.multiplyScalar(1 / s);
}
const smooth = (a, b, t) => { t = Math.min(1, Math.max(0, (t - a) / (b - a))); return t * t * (3 - 2 * t); };
// kim: squarer, wide below the cheekbones (jowls), a short flat chin, slightly flattened face
const HEAD_KIM = shaped(v => {
  squarify(v, 3.2);
  const y = v.y, jowl = smooth(0.2, -0.4, y) * (1 - smooth(-0.65, -1, y));   // widest below the cheekbones
  v.x *= 1.16 * (1 + 0.2 * jowl); v.z *= 0.96 * (1 + 0.07 * jowl);
  if (y < 0) v.y *= 0.8;                   // short chin
  if (y > 0.55) v.y = 0.55 + (y - 0.55) * 0.7;   // flatter crown under the hair block
  if (v.z > 0) v.z *= 1 - 0.12 * v.z;       // flatter face plane
});
// hype: longer egg-shaped head, full cheeks, a slightly narrower rounded chin
const HEAD_HYPE = shaped(v => {
  squarify(v, 2.5);
  const cheek = smooth(0.35, -0.2, v.y) * (1 - smooth(-0.55, -1, v.y));
  const chin = 1 - 0.08 * smooth(-0.5, -1, v.y);
  v.x *= 1.05 * (1 + 0.11 * cheek) * chin; v.z *= 0.98 * (1 + 0.05 * cheek); v.y *= 1.06;
});
// kim's hair: a boxy block, wider at the top than at the shaved line, flat on top, longer front to back
const HAIR_KIM = shaped(v => {
  squarify(v, 6.0);
  const taper = 1 + 0.14 * v.y;
  v.x *= taper; v.z *= taper;
  if (v.y > 0) v.y *= 0.5 + 0.42 * smooth(-0.6, 1, v.z);   // flat top that climbs toward the swept-up front
}, 32, 20);

// the face: a 1024x512 equirectangular canvas wrapped on the head; the front of the head is x = 256, the equator y = 256
function faceTexture(kind){
  const c = document.createElement('canvas'); c.width = 1024; c.height = 512;
  const x = c.getContext('2d'), F = 256, kim = kind === 'kim';
  x.fillStyle = SKIN; x.fillRect(0, 0, 1024, 512);
  x.lineCap = 'round'; x.lineJoin = 'round';
  const shade = (X, Y, rx, ry, a, col) => { x.fillStyle = 'rgba(' + (col || '150,95,70') + ',' + a + ')'; x.beginPath(); x.ellipse(X, Y, rx, ry, 0, 0, Math.PI * 2); x.fill(); };
  if (kim){
    // the lower face a touch warmer and darker, so the jowls read even in flat light
    const g = x.createLinearGradient(0, 220, 0, 512); g.addColorStop(0, 'rgba(160,100,70,0)'); g.addColorStop(1, 'rgba(160,100,70,0.2)');
    x.fillStyle = g; x.fillRect(0, 220, 1024, 292);
    // the high fade: shaved sides and back in blue-gray stubble, fading out under the hair block; the forehead stays clear
    x.fillStyle = 'rgba(54,50,56,0.6)';
    x.fillRect(0, 0, F - 120, 150); x.fillRect(F + 120, 0, 1024 - F - 120, 150);
    const fade = x.createLinearGradient(0, 150, 0, 215); fade.addColorStop(0, 'rgba(54,50,56,0.6)'); fade.addColorStop(1, 'rgba(54,50,56,0)');
    x.fillStyle = fade; x.fillRect(0, 150, F - 120, 65); x.fillRect(F + 120, 150, 1024 - F - 120, 65);
    // round warm cheeks, jowls, and a double chin with its crease
    shade(F - 98, 296, 52, 34, 0.2, '225,120,100'); shade(F + 98, 296, 52, 34, 0.2, '225,120,100');
    shade(F - 120, 322, 44, 40, 0.14); shade(F + 120, 322, 44, 40, 0.14);
    shade(F, 402, 140, 26, 0.26); shade(F, 368, 84, 12, 0.14);
    x.strokeStyle = 'rgba(120,80,60,0.42)'; x.lineWidth = 4; x.beginPath(); x.moveTo(F - 72, 386); x.quadraticCurveTo(F, 406, F + 72, 386); x.stroke();
  } else {
    // dark short hair under the cap line, sideburns
    x.fillStyle = '#1a1512';
    x.fillRect(0, 0, 1024, 150);
    x.fillRect(0, 150, F - 150, 40); x.fillRect(F + 150, 150, 1024 - F - 150, 40);
    for (const sd of [1, -1]) x.fillRect(F + sd * 150 - (sd > 0 ? 0 : 26), 190, 26, 70);
    shade(F, 368, 48, 18, 0.14);
  }
  // brows: thick, straight, low and close for kim (inner ends a little lower); softer arcs for the hype kid
  x.strokeStyle = '#1d1511'; x.lineWidth = kim ? 14 : 9;
  for (const sd of [1, -1]){
    x.beginPath();
    if (kim){ x.moveTo(F + sd * 24, 227); x.lineTo(F + sd * 96, 215); }
    else { x.moveTo(F + sd * 32, 210); x.quadraticCurveTo(F + sd * 66, 198, F + sd * 98, 208); }
    x.stroke();
  }
  // eyes: narrow slits with heavy upper lids and a slight upward tilt at the outer corner for kim
  for (const sd of [1, -1]){
    const ex = F + sd * (kim ? 60 : 64), ey = kim ? 250 : 240, tilt = kim ? -sd * 0.14 : 0;

    x.moveTo(ex - sd * (kim ? 22 : 22), ey + (kim ? 1 : -1)); x.quadraticCurveTo(ex, ey - (kim ? 6 : 11), ex + sd * (kim ? 22 : 22), ey + (kim ? -2 : 2)); x.stroke();

  x.stroke();
  if (kim){

    // nasolabial folds

  }
  return canvasTex(c);
}

function makeFigure(kind, hex, isMe){

  const skull = new T.Mesh(kim ? HEAD_KIM : HEAD_HYPE, faceMat); skull.scale.setScalar(R); skull.position.set(0, 0.17, 0); face.add(skull);
  face.add(ball(kim ? 0.024 : 0.022, skinMat, 0, kim ? 0.152 : 0.158, kim ? 0.162 : 0.165, 1.1, 0.8, 0.9));   // nose tip
  for (const side of [1, -1]) face.add(ball(kim ? 0.036 : 0.03, skinMat, (kim ? 0.19 : 0.172) * side, 0.16, -0.012, 0.5, 1.05, 0.8));   // ears
  if (!kim) for (const side of [1, -1]){ const tp = box(0.07, 0.006, 0.006, darkMat, 0.14 * side, 0.21, 0.12); tp.rotation.y = -1.1 * side; face.add(tp); }   // glasses temples
  if (kim){

    const hair = new T.Mesh(HAIR_KIM, hairMat); hair.scale.set(0.174, 0.162, 0.164); hair.position.set(0, 0.292, -0.01); hair.rotation.x = 0.06; face.add(hair);
    // a faint side parting groove across the top of the block

  } else {

    const dome = new T.Mesh(DOME, capMat); dome.scale.set(0.186, 0.17, 0.186); dome.position.set(0, 0.235, 0); face.add(dome);
    face.add(cyl(0.187, 0.187, 0.05, capMat, 0, 0.237, 0, 28));
    const brim = new T.Mesh(new T.CylinderGeometry(0.2, 0.2, 0.014, 24, 1, false, -Math.PI / 2, Math.PI), capMat);
    brim.position.set(0, 0.228, 0.04); brim.rotation.x = -0.12; face.add(brim);

    ring.rotation.x = -Math.PI / 2; ring.position.y = 0.016; g.add(ring);

}

function nameCanvas(name, isMe){
  const c = document.createElement('canvas'); c.width = 512; c.height = 112;
  const x = c.getContext('2d'); x.font = '600 42px ' + UI; x.textBaseline = 'middle';
  const tw = Math.min(x.measureText(name).width, 400), badge = isMe ? 58 : 0, w = tw + 44 + badge, X = (512 - w) / 2;
  x.fillStyle = THEME.tag.bg; rrect(x, X, 18, w, 76, 38); x.fill();
  x.strokeStyle = THEME.tag.line; x.lineWidth = 2; rrect(x, X + 1, 19, w - 2, 74, 37); x.stroke();
  if (isMe){
    x.fillStyle = THEME.led; x.beginPath(); x.arc(X + 43, 56, 21, 0, Math.PI * 2); x.fill();
    x.fillStyle = '#16110a'; x.font = '700 26px ' + UI; x.textAlign = 'center'; x.fillText('나', X + 43, 57);
    x.textAlign = 'left'; x.font = '600 42px ' + UI;
  }
  x.fillStyle = THEME.tag.text; x.fillText(name, X + 22 + badge, 58, 400);
  return c;
}
// 평단 chip above the name: "비트 15,000층", outlined red when the coin is above it, blue when below
function avgDir(avg){
  const s = avg && STOCK_BY[avg.s];
  const p = s ? view(s).p : null;
  return p == null ? 'flat' : signDir((p / avg.p - 1) * 100);
}
// 평단 in 만원 floors: 1,470,000원 → 147층, 224,000원 → 22층
function floorOf(p){ return Math.floor(p / 1e4); }
function avgLabel(avg){ return STOCK_BY[avg.s].short + ' ' + won(floorOf(avg.p)) + '층'; }
function avgCanvas(avg, dir){
  const c = document.createElement('canvas'); c.width = 512; c.height = 96;

  x.font = '600 38px ' + UI; const w2 = Math.min(x.measureText(price).width, 470 - w1);
  const w = w1 + w2 + 40, X = (512 - w) / 2, tone = dir === 'up' ? COL.up : dir === 'down' ? COL.down : null;
  x.fillStyle = THEME.tag.bg; rrect(x, X, 14, w, 68, 34); x.fill();
  x.strokeStyle = tone || 'rgba(236,231,220,0.3)'; x.lineWidth = 3; rrect(x, X + 1.5, 15.5, w - 3, 65, 32.5); x.stroke();
  x.textBaseline = 'middle';
  x.font = '700 38px ' + UI; x.fillStyle = COL.led; x.fillText(short, X + 20, 50);
  x.font = '600 38px ' + UI; x.fillStyle = tone || COL.text; x.fillText(price, X + 20 + w1, 50, w2);
  return c;
}
// chat bubble over an ant: up to three lines, bottom-anchored so it always sits right above the name
const CHAT_W = 640, CHAT_H = 232, CHAT_LINE = 44;
function wrapLines(x, text, max){
  const lines = []; let cur = '';
  for (const ch of text){
    const next = cur + ch;
    if (cur && x.measureText(next).width > max){
      const sp = cur.lastIndexOf(' ');
      if (sp > 0 && cur.length - sp < 9){ lines.push(cur.slice(0, sp)); cur = cur.slice(sp + 1) + ch; }
      else { lines.push(cur); cur = ch === ' ' ? '' : ch; }
    } else cur = next;
  }
  if (cur) lines.push(cur);
  return lines;
}
function chatCanvas(text, isMe){
  const c = document.createElement('canvas'); c.width = CHAT_W; c.height = CHAT_H;
  const x = c.getContext('2d'); x.font = '600 34px ' + UI;
  let lines = wrapLines(x, text, 560);
  if (lines.length > 3){ lines = lines.slice(0, 3); lines[2] = lines[2].slice(0, -1) + '…'; }
  const w = Math.min(CHAT_W - 16, Math.max(...lines.map(l => x.measureText(l).width)) + 44), h = lines.length * CHAT_LINE + 26;
  const X = (CHAT_W - w) / 2, Y = CHAT_H - 22 - h;
  x.fillStyle = 'rgba(236,231,220,0.97)'; rrect(x, X, Y, w, h, 24); x.fill();
  x.beginPath(); x.moveTo(CHAT_W / 2 - 14, Y + h - 1); x.lineTo(CHAT_W / 2, CHAT_H - 6); x.lineTo(CHAT_W / 2 + 14, Y + h - 1); x.fill();
  if (isMe){ x.strokeStyle = '#ffb547'; x.lineWidth = 4; rrect(x, X + 2, Y + 2, w - 4, h - 4, 22); x.stroke(); }
  x.fillStyle = '#16140f'; x.textAlign = 'center'; x.textBaseline = 'middle';
  lines.forEach((l, i) => x.fillText(l, CHAT_W / 2, Y + 13 + CHAT_LINE / 2 + i * CHAT_LINE));
  return c;
}

let avatarSeq = 0;
class Avatar {
  constructor(o){
    this.isMe = !!o.isMe; this.name = o.name; this.seed = (avatarSeq++) * 1.7;
    this.color = ((o.color | 0) % BODY.length + BODY.length) % BODY.length;
    this.p = makeFigure(o.kind || 'kim', BODY[this.color], this.isMe);
    this.g = this.p.g; scene.add(this.g);
    this.labelMat = new T.SpriteMaterial({ map: canvasTex(nameCanvas(o.name, this.isMe)), transparent: true, depthTest: false, depthWrite: false });
    this.label = new T.Sprite(this.labelMat); this.label.scale.set(1.64, 0.36, 1); this.label.renderOrder = 10; this.g.add(this.label);
    this.chatMat = new T.SpriteMaterial({ transparent: true, depthTest: false, depthWrite: false, opacity: 0 });
    this.chatSprite = new T.Sprite(this.chatMat); this.chatSprite.scale.set(CHAT_W * 0.0032, CHAT_H * 0.0032, 1); this.chatSprite.visible = false; this.chatSprite.renderOrder = 11; this.g.add(this.chatSprite);
    this.chatText = null; this.chatAt = 0; this.chatUntil = 0;
    this.avgMat = new T.SpriteMaterial({ transparent: true, depthTest: false, depthWrite: false });
    this.avgSprite = new T.Sprite(this.avgMat); this.avgSprite.scale.set(1.5, 0.28, 1); this.avgSprite.visible = false; this.avgSprite.renderOrder = 10; this.g.add(this.avgSprite);
    this.avg = null; this.avgKey = '';
    this.setAvg(o.avg || null);
    this.x = o.x || 0; this.z = o.z || 0; this.r = o.r != null ? o.r : Math.PI; this.tx = this.x; this.tz = this.z; this.tr = this.r;
    this.sitting = false; this.speed = 0; this.phase = 0;
  }
  setName(name, force){
    if (name === this.name && !force) return;
    this.name = name;
    const old = this.labelMat.map; this.labelMat.map = canvasTex(nameCanvas(name, this.isMe)); this.labelMat.needsUpdate = true; old.dispose();
  }
  // redraws only when the stock, the number, or the profit/loss side changes (or force after fonts load)
  setAvg(avg, force){
    this.avg = cleanAvg(avg);
    if (!this.avg){ this.avgSprite.visible = false; this.avgKey = ''; return; }
    const dir = avgDir(this.avg), key = this.avg.s + ':' + this.avg.p + ':' + dir;
    this.avgSprite.visible = true;
    if (key === this.avgKey && !force) return;
    this.avgKey = key;
    const old = this.avgMat.map; this.avgMat.map = canvasTex(avgCanvas(this.avg, dir)); this.avgMat.needsUpdate = true;
    if (old) old.dispose();
  }
  // a chat line over the head for a few seconds (longer lines stay a little longer)
  say(text){
    const old = this.chatMat.map;
    this.chatMat.map = canvasTex(chatCanvas(text, this.isMe)); this.chatMat.needsUpdate = true;
    if (old) old.dispose();
    this.chatText = text; this.lastLine = text; this.chatAt = performance.now();
    this.chatUntil = this.chatAt + Math.min(8000, 3500 + 120 * [...text].length);
    this.chatSprite.visible = true;
  }
  hush(){ this.chatSprite.visible = false; this.chatText = null; this.chatUntil = 0; }
  update(dt, t){
    const P = this.p;
    this.g.position.set(this.x, 0, this.z);
    let ry = this.r;
    P.legL.rotation.set(0, 0, 0); P.legR.rotation.set(0, 0, 0);
    P.armL.rotation.set(0, 0, 0); P.armR.rotation.set(0, 0, 0);
    P.head.rotation.set(0, 0, 0); P.abd.rotation.set(0, 0, 0); P.body.rotation.set(0, 0, 0);
    P.kneeL.rotation.set(0, 0, 0); P.kneeR.rotation.set(0, 0, 0);
    let by = 0;
    const moving = this.speed > 0.25 && !this.sitting;
    if (moving){
      this.phase += dt * this.speed * 4.2; const s = Math.sin(this.phase);
      P.legL.rotation.x = s * 0.55; P.legR.rotation.x = -s * 0.55;
      P.kneeL.rotation.x = Math.max(0, -s) * 0.7; P.kneeR.rotation.x = Math.max(0, s) * 0.7;
      P.armL.rotation.x = -s * 0.4; P.armR.rotation.x = s * 0.4;
      by = Math.abs(Math.cos(this.phase)) * 0.035;
    } else if (!reduceMotion){
      by = Math.sin(t * 1.8 + this.seed) * 0.01;
    }
    if (!reduceMotion){
      P.head.rotation.y = Math.sin(t * 0.9 + this.seed) * 0.08;
      P.head.rotation.x = Math.sin(t * 1.3 + this.seed) * 0.03;
    }
    if (this.sitting){
      by = SEAT_Y - P.hip + 0.03;
      P.legL.rotation.x = P.legR.rotation.x = -1.45;
      P.kneeL.rotation.x = P.kneeR.rotation.x = 1.35;
      P.armL.rotation.x = P.armR.rotation.x = -0.45;
    }
    P.body.position.y = by;
    this.g.rotation.y = ry;
    this.label.position.y = 2.15 + by;
    this.avgSprite.position.y = 2.4 + by;
    if (this.chatSprite.visible){
      const now = performance.now();
      if (now >= this.chatUntil) this.hush();
      else {
        this.chatMat.opacity = Math.min(1, (now - this.chatAt) / 160) * Math.min(1, (this.chatUntil - now) / 500);
        this.chatSprite.position.y = (this.avg ? 2.92 : 2.7) + by;
      }
    }
  }
  dispose(){
    scene.remove(this.g);
    this.labelMat.map.dispose(); this.labelMat.dispose();
    if (this.chatMat.map) this.chatMat.map.dispose(); this.chatMat.dispose();
    if (this.avgMat.map) this.avgMat.map.dispose(); this.avgMat.dispose();
    this.p.mats.forEach(m => { if (m.map) m.map.dispose(); m.dispose(); });
  }
}

/* ------------------------------------------------------------------
   Me
   ------------------------------------------------------------------ */
const ADJ = ['존버하는', '물타는', '풀매수한', '단타치는', '숏친', '롱잡은', '청산당한', '익절한', '손절한', '졸린', '배고픈', '떨리는', '침착한', '느긋한', '설레는', '꼼꼼한', '조용한', '핵존버', '떡상기원', '한강뷰'];
const NOUN = ['김정은'];
function saveMe(){ try { localStorage.setItem('gaemi-me', JSON.stringify(me)); } catch (e) {} }
// the room server accepts exactly these names (worker/src/gaekjang.ts keeps the same two lists)
const NAMES = new Set(ADJ.flatMap(a => NOUN.map(n => a + ' ' + n)));
function freshName(){ return ADJ[(Math.random() * ADJ.length) | 0] + ' ' + NOUN[(Math.random() * NOUN.length) | 0]; }
function loadMe(){
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem('gaemi-me') || 'null'); } catch (e) {}
  if (saved && typeof saved.name === 'string' && Number.isInteger(saved.color)){
    const m = { name: NAMES.has(saved.name) ? saved.name : freshName(), color: (saved.color % BODY.length + BODY.length) % BODY.length, avg: cleanAvg(saved.avg) };
    if (m.name !== saved.name || m.color !== saved.color) try { localStorage.setItem('gaemi-me', JSON.stringify(m)); } catch (e) {}
    return m;
  }
  const fresh = { name: freshName(), color: (Math.random() * BODY.length) | 0, avg: null };
  try { localStorage.setItem('gaemi-me', JSON.stringify(fresh)); } catch (e) {}
  return fresh;
}
const me = loadMe();
const player = new Avatar({ name: me.name, color: me.color, avg: me.avg, isMe: true, x: (Math.random() - 0.5) * 1.2, z: 5 + Math.random() * 1.2, r: Math.PI });
// (spawn in the middle aisle so the camera starts square to the board)
let target = null;

function clampRoom(v, a, b){ return Math.max(a, Math.min(b, v)); }
function angleLerp(a, b, k){ const d = ((b - a + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI; return a + d * k; }
// facing always stays in [-π, π) so it never piles up past a full turn
function wrapA(a){ const t = Math.PI * 2; return ((a + Math.PI) % t + t) % t - Math.PI; }

const keys = new Set();
const SPEED = 3.2;
let camYaw = 0, camPitch = 0.2, camDist = 7.4;
// ?cam=yaw,pitch,dist starts the camera somewhere else (used for screenshots)
let camLookY = null;
(function(){ const q = new URLSearchParams(location.search).get('cam'); if (!q) return; const [y, p, d, l] = q.split(',').map(Number);
  if (isFinite(y)) camYaw = y; if (isFinite(p)) camPitch = clampRoom(p, -0.05, 0.95); if (isFinite(d)) camDist = clampRoom(d, 1.2, 16); if (isFinite(l)) camLookY = l; })();
function updatePlayer(dt){
  let f = 0, s = 0;
  if (keys.has('KeyW') || keys.has('ArrowUp')) f += 1;
  if (keys.has('KeyS') || keys.has('ArrowDown')) f -= 1;
  if (keys.has('KeyD') || keys.has('ArrowRight')) s += 1;
  if (keys.has('KeyA') || keys.has('ArrowLeft')) s -= 1;
  let vx = 0, vz = 0;
  if (f || s){
    target = null; player.sitting = false;
    const fx = -Math.sin(camYaw), fz = -Math.cos(camYaw), rx = -fz, rz = fx;
    vx = fx * f + rx * s; vz = fz * f + rz * s;
    const l = Math.hypot(vx, vz); vx = vx / l * SPEED; vz = vz / l * SPEED;
  } else if (target){
    const dx = target.x - player.x, dz = target.z - player.z, d = Math.hypot(dx, dz);
    if (d < 0.04){
      player.x = target.x; player.z = target.z;
      if (target.seat >= 0){ player.sitting = true; }
      target = null;
    } else {
      const sp = Math.min(SPEED, d / Math.max(dt, 1e-3)); vx = dx / d * sp; vz = dz / d * sp;
    }
  }
  if (vx || vz){
    player.x = clampRoom(player.x + vx * dt, ROOM.x0 + 0.6, ROOM.x1 - 0.6);
    player.z = clampRoom(player.z + vz * dt, ROOM.z0 + 1.4, ROOM.z1 - 0.6);
    player.r = wrapA(angleLerp(player.r, Math.atan2(vx, vz), 1 - Math.exp(-dt * 14)));
    player.speed = Math.hypot(vx, vz);
  } else player.speed = 0;
  if (player.sitting && !target) player.r = wrapA(angleLerp(player.r, Math.PI, 1 - Math.exp(-dt * 10)));
}

/* ------------------------------------------------------------------
   Camera: third person behind the player, or straight at the board
   ------------------------------------------------------------------ */
const camPos = new T.Vector3(player.x, 3.4, player.z + 6), camLook = new T.Vector3(player.x, 2.4, player.z);
const wantPos = new T.Vector3(), wantLook = new T.Vector3();
// portrait phones get a wider lens so the full board width fits from the benches
function baseFov(){ return camera.aspect < 0.8 ? 76 : 55; }
function updateCamera(dt){
  const wantFov = baseFov();
  const hy = player.sitting ? 1.25 : 1.5;
  wantPos.set(
    player.x + Math.sin(camYaw) * Math.cos(camPitch) * camDist,
    hy + 0.6 + Math.sin(camPitch) * camDist,
    player.z + Math.cos(camYaw) * Math.cos(camPitch) * camDist);
  wantPos.x = clampRoom(wantPos.x, ROOM.x0 + 0.3, ROOM.x1 - 0.3);
  wantPos.z = clampRoom(wantPos.z, ROOM.z0 + 0.5, ROOM.z1 - 0.3);
  wantPos.y = clampRoom(wantPos.y, 0.6, ROOM.h - 0.4);
  wantLook.set(player.x, camLookY != null ? camLookY : hy + 1.75, player.z);
  const k = 1 - Math.exp(-dt * 6);
  camPos.lerp(wantPos, k); camLook.lerp(wantLook, k);
  camera.position.copy(camPos); camera.lookAt(camLook);
  if (Math.abs(camera.fov - wantFov) > 0.05){ camera.fov += (wantFov - camera.fov) * k; camera.updateProjectionMatrix(); }
}

/* ------------------------------------------------------------------
   Input
   ------------------------------------------------------------------ */
const ray = new T.Raycaster(), ndc = new T.Vector2();
const hint = $('#hint');
let hintGone = false;
function dropHint(){ if (!hintGone){ hintGone = true; hint.classList.add('gone'); } }
setTimeout(dropHint, 9000);

function tapAt(cx, cy){
  const rect = canvas.getBoundingClientRect();
  ndc.set((cx - rect.left) / rect.width * 2 - 1, -((cy - rect.top) / rect.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const pid = peerAt();
  if (pid){ openPeer(pid); return; }
  const hits = ray.intersectObjects([seatMesh, floorMesh], false);
  if (!hits.length) return;
  const h = hits[0];
  if (h.object === seatMesh && h.instanceId != null){
    let best = -1, bd = Infinity;
    seats.forEach((s, i) => { if (s.bench !== h.instanceId) return; const d = Math.abs(s.x - h.point.x); if (d < bd){ bd = d; best = i; } });
    if (best >= 0){ const s = seats[best]; target = { x: s.x, z: s.z, seat: best }; player.sitting = false; showMarker(s.x, s.z); }
  } else {
    const x = clampRoom(h.point.x, ROOM.x0 + 0.6, ROOM.x1 - 0.6), z = clampRoom(h.point.z, ROOM.z0 + 1.4, ROOM.z1 - 0.6);
    target = { x, z, seat: -1 }; player.sitting = false; showMarker(x, z);
  }
  dropHint();
}
function showMarker(x, z){ marker.position.x = x; marker.position.z = z; markerT = 1; }

const pointers = new Map();
let drag = null, pinchD = 0;
canvas.addEventListener('pointerdown', e => {
  canvas.focus({ preventScroll: true });
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 1) drag = { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, moved: false };
  else if (pointers.size === 2){ drag = null; const [a, b] = [...pointers.values()]; pinchD = Math.hypot(a.x - b.x, a.y - b.y); }
});
canvas.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2){
    const [a, b] = [...pointers.values()], d = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinchD > 0 && d > 0) camDist = clampRoom(camDist * pinchD / d, 3, 16);
    pinchD = d; return;
  }
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.x = e.clientX; drag.y = e.clientY;
  if (!drag.moved && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 6){ drag.moved = true; canvas.classList.add('dragging'); }
  if (drag.moved){
    camYaw -= dx * 0.006;
    camPitch = clampRoom(camPitch + dy * 0.004, -0.05, 0.95);
    dropHint();
  }
});
function endPointer(e, cancelled){
  if (!pointers.has(e.pointerId)) return;
  pointers.delete(e.pointerId);
  if (drag && !drag.moved && !cancelled && pointers.size === 0) tapAt(e.clientX, e.clientY);
  if (pointers.size === 0){ drag = null; pinchD = 0; canvas.classList.remove('dragging'); }
}
canvas.addEventListener('pointerup', e => endPointer(e, false));
canvas.addEventListener('pointercancel', e => endPointer(e, true));
canvas.addEventListener('wheel', e => { e.preventDefault(); camDist = clampRoom(camDist * (1 + e.deltaY * 0.0012), 3, 16); }, { passive: false });

window.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey || blocked) return;
  // while the 평단 panel is open (focus in it or not), keys never walk the ant; Esc closes it
  if (!avgPanel.hidden){ if (e.key === 'Escape'){ e.preventDefault(); closeAvg(true); } return; }
  if (!peerCard.hidden && e.key === 'Escape'){ e.preventDefault(); closePeer(); return; }
  if (e.target && e.target.closest && e.target.closest('input, textarea, select')) return;
  // Enter jumps into the chat box (not while a button or link has focus)
  if (e.key === 'Enter' && (e.target === document.body || e.target === canvas) && !chatBar.hidden && !chatInput.disabled){
    e.preventDefault(); chatInput.focus({ preventScroll: true }); return;
  }
  if (['KeyW', 'KeyA', 'KeyS', 'KeyD', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)){
    keys.add(e.code); dropHint();
    if (e.code.startsWith('Arrow')) e.preventDefault();
  }
});
window.addEventListener('keyup', e => keys.delete(e.code));
window.addEventListener('blur', () => keys.clear());

/* ------------------------------------------------------------------
   Shared room: everyone on this page sees each other's ants.
   Server: api.korulive.com/gaekjang/ws (Cloudflare Durable Object,
   worker/src/gaekjang.ts). There is one room for 100 people. When it is
   full nobody else gets in: the page shows "객장이 꽉 찼어요" instead of
   the room and walks in by itself once a spot opens up.
   Chat: what you type pops up over your ant for a few seconds (40 chars,
   every 3 s, starting a minute after you walk in). Tap someone's ant to
   report them: their words never show on your screen again, and once
   several people report the same ant it can't talk at all.
   ------------------------------------------------------------------ */
const WS_BASE = (() => {
  // only a local copy of the page may point somewhere else: ?ws=ws://127.0.0.1:8787 (wrangler dev)
  const local = location.protocol === 'file:' || /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
  const q = local ? new URLSearchParams(location.search).get('ws') : null;
  return q && /^wss?:\/\/[\w.:\-\[\]]+$/.test(q) ? q : 'wss://api.korulive.com';
})();
const FULL_RETRY_MS = 20000;   // while the room is full, check for a free spot about this often
const SEND_MS = 150;           // my state goes out at most ~7×/s, and only the fields that changed
const PING_MS = 25000;         // keepalive; the server answers it without waking the room
const DEAD_MS = 70000;         // nothing heard for this long → reconnect
const HIDDEN_MS = 120000;      // a tab left in the background gives its spot back after 2 min
const SOLO_AFTER_MS = 10000;   // not in a room after this long → "혼자 보는 중" (it keeps trying)
const AVG_GAP_MS = 1500;       // the server penalises 평단 changes closer than 1s, so a quick re-edit waits its turn
const CHAT_MAX = 40, CHAT_GAP_MS = 3000;   // same limits as the server
function hex32(){ const b = new Uint8Array(16); crypto.getRandomValues(b); return Array.from(b, v => v.toString(16).padStart(2, '0')).join(''); }
// a random key per page load: when this page reconnects, the server retires its old connection first,
// so a link that died silently never leaves a second copy of me (or holds my seat in a full room)
const PAGE_KEY = hex32();
// a random key per browser (kept): the server hashes it for the 1-minute wait and chat spacing,
// and hands others a speaker key made from it, so a block I make keeps working when that person comes back
const DEVICE_KEY = (() => {
  try {
    let v = localStorage.getItem('gaemi-dev');
    if (!/^[0-9a-f]{32}$/.test(v || '')){ v = hex32(); localStorage.setItem('gaemi-dev', v); }
    return v;
  } catch (e) { return hex32(); }
})();
// people I blocked: their words never show on my screen (kept in this browser, by their speaker key).
// Only this page knows; nothing about it goes to the server.
const BLOCK_KEY = 'gaemi-block';
const blockedSk = new Set((() => {
  try { const a = JSON.parse(localStorage.getItem(BLOCK_KEY) || '[]'); return Array.isArray(a) ? a.filter(v => typeof v === 'string' && /^[0-9a-f]{12}$/.test(v)).slice(-300) : []; }
  catch (e) { return []; }
})());
function saveBlocks(){ try { localStorage.setItem(BLOCK_KEY, JSON.stringify([...blockedSk].slice(-300))); } catch (e) {} }
function isHidden(av){ return !!(av && av.sk && blockedSk.has(av.sk)); }
const others = new Map();      // peer id → Avatar (a Map, so ids never touch object prototypes)
let ws = null, myId = null, roomNo = 1, retryN = 0, paused = false, sent = null, blocked = false;
let retryT = 0, soloT = 0, clearT = 0, hiddenT = 0, lastHeard = 0, lastSent = 0, lastAvgSent = 0;
let chatMode = 'on', chatAtLocal = Infinity, canChat = false, lastChatSent = 0, lastChatText = '', chatTimer = 0;

const r2 = v => Math.round(v * 100) / 100;
function isOpen(){ return !!(ws && ws.readyState === 1 && myId); }
function myState(){
  return { n: me.name, c: me.color, x: r2(player.x), z: r2(player.z), r: r2(wrapA(player.r)),
    s: player.sitting ? 1 : 0, a: me.avg ? [me.avg.s, me.avg.p] : null };
}
// only what changed since the last send (everything right after joining)
function sendState(force){
  if (!isOpen() || ws.bufferedAmount > 65536) return;
  const now = performance.now();
  if (!force && now - lastSent < SEND_MS) return;
  const st = myState(), out = { t: 's' };
  let any = false;
  for (const k of Object.keys(st)){
    if (sent && JSON.stringify(st[k]) === JSON.stringify(sent[k])) continue;
    if (k === 'a' && sent && now - lastAvgSent < AVG_GAP_MS){ st.a = sent.a; continue; }   // goes out on a later frame
    out[k] = st[k]; any = true;
  }
  if (!any) return;
  if (hasOwn(out, 'a')) lastAvgSent = now;
  ws.send(JSON.stringify(out)); sent = st; lastSent = now;
}

/* ---- chat ---- */
const chatBar = $('#chatBar'), chatInput = $('#chatInput'), chatSend = $('#chatSend'), toastEl = $('#toast');
function cleanChatText(v){
  if (typeof v !== 'string') return '';
  const t = v.replace(/[\t\n\r\f\v]+/g, ' ').replace(/[\u0000-\u001f\u007f-\u009f\u00ad\u061c\u115f\u1160\u180e\u200b-\u200f\u202a-\u202e\u2060-\u206f\u3164\ufeff\uffa0]/g, '')
    .replace(/[\u0590-\u08ff\ufb1d-\ufdff\ufe70-\ufefe\u{10800}-\u{10fff}\u{1e800}-\u{1efff}]/gu, '')
    .replace(/\s+/g, ' ').trim();
  return [...t].slice(0, CHAT_MAX).join('');
}
let toastT = 0;
function toast(msg){
  toastEl.textContent = msg; toastEl.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => { toastEl.hidden = true; }, 2800);
}
function chatState(){
  if (blocked) return 'gate';
  if (chatMode === 'off') return 'off';
  if (!isOpen()) return 'offline';
  if (!canChat) return 'off';
  if (Date.now() < chatAtLocal) return 'wait';
  return 'ok';
}
const CHAT_PH = { offline: '연결되면 쓸 수 있어요', ok: '한마디 하기 (40자)' };
function renderChat(){
  clearTimeout(chatTimer);
  const st = chatState();
  chatBar.hidden = st === 'off' || st === 'gate';
  if (chatBar.hidden) return;
  if (st === 'wait'){
    const left = chatAtLocal - Date.now();
    chatInput.placeholder = Math.ceil(left / 1000) + '초 뒤부터 쓸 수 있어요';
    chatTimer = setTimeout(renderChat, (left % 1000 || 1000) + 5);   // tick right when the number changes
  } else chatInput.placeholder = CHAT_PH[st] || '';
  chatInput.disabled = st !== 'ok';
  chatSend.disabled = st !== 'ok' || !chatInput.value.trim();
}
function sendChat(){
  if (chatState() !== 'ok') return;
  const text = cleanChatText(chatInput.value);
  if (!text) return;
  if (Date.now() - lastChatSent < CHAT_GAP_MS){ toast('조금 천천히 보내 주세요'); return; }
  ws.send(JSON.stringify({ t: 'c', m: text }));
  lastChatSent = Date.now(); lastChatText = text;
  chatInput.value = ''; chatSend.disabled = true;
}
const CX_TEXT = {
  wait: '들어오고 1분 뒤부터 쓸 수 있어요', slow: '조금 천천히 보내 주세요', same: '같은 말은 잠시 뒤에 다시 보낼 수 있어요',
  long: '40자까지 쓸 수 있어요', blocked: '링크·연락처·홍보·욕설은 보낼 수 없어요', off: '지금은 채팅이 꺼져 있어요',
  nodev: '이 브라우저에서는 채팅을 쓸 수 없어요',
};
// the room turned a line down: say why, and give the words back so they can be fixed
function onChatRefused(m){
  const why = typeof m.why === 'string' && hasOwn(CX_TEXT, m.why) ? m.why : null;
  if (!why) return;
  if (why === 'off') chatMode = 'off';
  else if (why === 'nodev') canChat = false;
  else if (why === 'wait' && Number.isFinite(m.left)) chatAtLocal = Date.now() + Math.max(0, m.left);
  if (why === 'slow' && Number.isFinite(m.left)) lastChatSent = Date.now() + m.left - CHAT_GAP_MS;
  else if (['same', 'long', 'blocked'].includes(why)) lastChatSent = 0;
  if (['wait', 'slow', 'same', 'long', 'blocked'].includes(why) && !chatInput.value && lastChatText) chatInput.value = lastChatText;
  toast(CX_TEXT[why]);
  renderChat();
}
chatBar.addEventListener('submit', e => { e.preventDefault(); sendChat(); });
chatInput.addEventListener('input', e => {
  // 40 characters (an emoji counts as one); never cut in the middle of composing a Korean syllable
  if (!e.isComposing){ const cs = [...chatInput.value]; if (cs.length > CHAT_MAX) chatInput.value = cs.slice(0, CHAT_MAX).join(''); }
  chatSend.disabled = chatState() !== 'ok' || !chatInput.value.trim();
});
chatInput.addEventListener('compositionend', () => { const cs = [...chatInput.value]; if (cs.length > CHAT_MAX) chatInput.value = cs.slice(0, CHAT_MAX).join(''); });
chatInput.addEventListener('focus', () => { keys.clear(); target = null; dropHint(); closePeer(); });
chatInput.addEventListener('keydown', e => { if (e.key === 'Escape'){ e.preventDefault(); chatInput.blur(); canvas.focus({ preventScroll: true }); } });
// phones: keep the bar (and its messages) above the on-screen keyboard
function placeChatBar(){
  const vv = window.visualViewport;
  const kb = vv ? Math.max(0, window.innerHeight - vv.height - vv.offsetTop) : 0;
  chatBar.style.bottom = kb > 60 ? (kb + 8) + 'px' : '';
  toastEl.style.bottom = kb > 60 ? (kb + 62) + 'px' : '';
}
if (window.visualViewport){ visualViewport.addEventListener('resize', placeChatBar); visualViewport.addEventListener('scroll', placeChatBar); }
chatInput.addEventListener('blur', () => setTimeout(() => { placeChatBar(); if (window.scrollY) window.scrollTo(0, 0); }, 60));

/* ---- someone's card: tap their ant to block (or unblock) them on my screen ---- */
const peerCard = $('#peerCard'), peerName = $('#peerName'), peerNote = $('#peerNote'), peerBlock = $('#peerBlock'), peerClose = $('#peerClose');
let peerId = null;
function peerAt(){
  if (!others.size || chatMode === 'off') return null;
  const groups = []; others.forEach(av => groups.push(av.g));
  const found = [];   // [peer id, distance, hit its chat bubble]
  for (const h of ray.intersectObjects(groups, true)){
    let id = null, shown = true;
    for (let o = h.object; o; o = o.parent){
      if (!o.visible || (o.userData && o.userData.noPick)) shown = false;
      if (o.userData && typeof o.userData.peerId === 'string'){ id = o.userData.peerId; break; }
    }
    if (!id || !shown) continue;
    const av = others.get(id);
    if (av) found.push([id, h.distance, h.object === av.chatSprite]);
  }
  if (!found.length) return null;
  const bubble = found.find(f => f[2]);
  if (bubble) return bubble[0];
  // ants on the same spot: prefer the one that is talking right now
  const near = found.filter(f => f[1] < found[0][1] + 0.8);
  const talking = near.find(f => { const av = others.get(f[0]); return av && av.chatSprite.visible; });
  return (talking || found[0])[0];
}
function openPeer(id){
  const av = others.get(id);
  if (!av) return;
  closeAvg(false);
  peerId = id;
  peerName.textContent = av.name;
  const done = isHidden(av);
  const said = !done && av.lastLine ? '마지막으로 한 말: "' + av.lastLine + '"\n' : '';
  peerNote.textContent = !av.sk ? '' : done ? '차단한 사람이에요. 이 사람이 하는 말은 내 화면에 안 보여요.'
    : said + '차단하면 이 사람이 하는 말이 내 화면에서 계속 안 보여요. 상대는 알 수 없어요.';
  peerBlock.textContent = done ? '차단 풀기' : '차단하기';
  peerBlock.className = done ? 'ghost' : 'danger';
  peerBlock.hidden = !av.sk;   // no speaker key → this ant can't chat, nothing to block
  peerCard.hidden = false;
  dropHint();
}
function closePeer(){ if (!peerCard.hidden){ peerCard.hidden = true; peerId = null; } }
peerClose.addEventListener('click', closePeer);
peerBlock.addEventListener('click', () => {
  const av = peerId ? others.get(peerId) : null;
  if (av && av.sk){
    if (blockedSk.has(av.sk)){
      blockedSk.delete(av.sk); saveBlocks();
      toast('차단을 풀었어요. 이제 이 사람이 하는 말이 보여요.');
    } else {
      blockedSk.add(av.sk); saveBlocks(); av.hush();
      toast('차단했어요. 이 사람이 하는 말은 이제 안 보여요.');
    }
  }
  closePeer();
});
document.addEventListener('pointerdown', e => { if (!peerCard.hidden && !peerCard.contains(e.target)) closePeer(); }, true);

function cleanName(v){
  const s = typeof v === 'string' ? v.replace(/[\u0000-\u001f\u007f-\u009f\u200b-\u200f\u202a-\u202e\u2066-\u2069]/g, '').trim().slice(0, 16) : '';
  return s || '이름 없는 김정은';
}
function num(v, a, b, d){ return typeof v === 'number' && isFinite(v) ? Math.max(a, Math.min(b, v)) : d; }
function int(v, n){ return Number.isInteger(v) ? ((v % n) + n) % n : 0; }
function avgOf(a){ return Array.isArray(a) ? cleanAvg({ s: a[0], p: a[1] }) : null; }
// a full state makes a new ant; after that only the fields that came in are applied
function upsertPeer(p){
  if (!p || typeof p !== 'object' || typeof p.id !== 'string' || p.id === myId) return null;
  let av = others.get(p.id);
  if (av && hasOwn(p, 'c') && int(p.c, BODY.length) !== av.color){
    const old = av;   // the body color is baked into the model, so rebuild it in place
    av = new Avatar({ name: old.name, color: int(p.c, BODY.length), avg: old.avg, x: old.x, z: old.z, r: old.r });
    av.tx = old.tx; av.tz = old.tz; av.tr = old.tr; av.sitting = old.sitting; av.sk = old.sk; av.g.userData.peerId = p.id;
    old.dispose(); others.set(p.id, av);
  }
  if (!av){
    if (typeof p.n !== 'string' || !Number.isInteger(p.c) || typeof p.x !== 'number' || typeof p.z !== 'number') return null;
    av = new Avatar({ name: cleanName(p.n), color: int(p.c, BODY.length), avg: avgOf(p.a),
      x: num(p.x, ROOM.x0, ROOM.x1, 0), z: num(p.z, ROOM.z0, ROOM.z1, 6), r: wrapA(num(p.r, -10, 10, Math.PI)) });
    av.sitting = p.s === 1;
    av.g.userData.peerId = p.id;
    if (typeof p.sk === 'string' && /^[0-9a-f]{12}$/.test(p.sk)) av.sk = p.sk;
    others.set(p.id, av);
    return av;
  }
  if (hasOwn(p, 'n')) av.setName(cleanName(p.n));
  if (hasOwn(p, 'a')) av.setAvg(avgOf(p.a));
  if (hasOwn(p, 'x')) av.tx = num(p.x, ROOM.x0, ROOM.x1, av.tx);
  if (hasOwn(p, 'z')) av.tz = num(p.z, ROOM.z0, ROOM.z1, av.tz);
  if (hasOwn(p, 'r')) av.tr = wrapA(num(p.r, -10, 10, av.tr));
  if (hasOwn(p, 's')) av.sitting = p.s === 1;
  return av;
}
function removePeer(id){ const av = others.get(id); if (av){ av.dispose(); others.delete(id); } if (peerId === id) closePeer(); }
function clearPeers(){ for (const id of [...others.keys()]) removePeer(id); }

const countEl = $('#count'), dotEl = $('#dot');
// very narrow phones (under 360px) get the short form so 평단 입력 stays on the same row
const narrowHud = window.matchMedia ? matchMedia('(max-width:359px)') : null;
function renderCount(){
  const live = roomState === 'live', short = !!(narrowHud && narrowHud.matches);
  countEl.textContent = live ? roomCount + (short ? '명' : '명 함께 보는 중') : roomState === 'solo' ? '혼자 보는 중'
    : roomState === 'full' ? (short ? '가득 찼어요' : '객장이 가득 찼어요') : '연결 중';
  dotEl.classList.toggle('live', live);
  // (no board repaint here: the footer picks the count up on the clock's once-a-second repaint)
}
if (narrowHud && narrowHud.addEventListener) narrowHud.addEventListener('change', renderCount);
// the HUD and the board footer are redrawn only when the state or the head count actually changes
function setRoom(state, count){
  const n = Number.isInteger(count) && count > 0 ? count : roomCount;
  if (state === roomState && n === roomCount) return;
  roomState = state; roomCount = n;
  renderCount();
}

function onHello(m){
  myId = typeof m.id === 'string' ? m.id : null;
  if (Number.isInteger(m.room)) roomNo = m.room;
  retryN = 0; sent = null;
  unblock();
  clearTimeout(clearT); clearTimeout(soloT);
  const here = new Set();
  if (Array.isArray(m.peers)) for (const p of m.peers){
    const av = upsertPeer(p);
    if (!av) continue;
    here.add(p.id);
  }
  for (const id of [...others.keys()]) if (!here.has(id)) removePeer(id);
  setRoom('live', Math.max(1, m.count | 0));
  // chat: on / off, and when I may start (chatAt is server time)
  chatMode = m.chat === 'off' ? 'off' : 'on';
  const skew = Number.isFinite(m.now) ? Date.now() - m.now : 0;
  chatAtLocal = Number.isFinite(m.chatAt) ? m.chatAt + skew : Date.now() + 60000;
  canChat = m.canChat === true;
  renderChat();
  sendState(true);   // my whole state, also after every reconnect
}
function onTick(m){
  if (Array.isArray(m.up)) for (const p of m.up) upsertPeer(p);
  if (Array.isArray(m.chat)) for (const c of m.chat){
    if (!c || typeof c.id !== 'string') continue;
    const text = cleanChatText(c.m);
    if (!text) continue;
    if (c.id === myId){ player.say(text); continue; }
    const av = others.get(c.id);
    if (av && !isHidden(av)) av.say(text);
  }
  if (Array.isArray(m.left)) for (const id of m.left) if (typeof id === 'string') removePeer(id);
  if (Number.isInteger(m.count)) setRoom('live', Math.max(1, m.count));
}
function onMessage(data){
  lastHeard = Date.now();
  if (typeof data !== 'string' || data === 'pong') return;
  let m; try { m = JSON.parse(data); } catch (e) { return; }
  if (!m || typeof m !== 'object') return;
  if (m.t === 'tick') onTick(m);
  else if (m.t === 'hello') onHello(m);
  else if (m.t === 'full') roomFull(m);
  else if (m.t === 'cx') onChatRefused(m);
}

function connect(){
  clearTimeout(retryT); retryT = 0;
  if (ws || paused) return;
  let sock;
  try { sock = new WebSocket(WS_BASE + '/gaekjang/ws?room=' + roomNo + '&k=' + PAGE_KEY + '&d=' + DEVICE_KEY); } catch (e) { scheduleRetry(); return; }
  ws = sock; lastHeard = Date.now();
  sock.onmessage = ev => { if (ws === sock) onMessage(ev.data); };
  sock.onclose = ev => { if (ws === sock) onClosed(ev.code); };
  if (roomState !== 'live') armSolo();
}
// let go of the socket now, without waiting for its close event
function drop(code){
  const s = ws; ws = null; myId = null; sent = null;
  if (s){ s.onmessage = s.onclose = null; try { s.close(code || 1000); } catch (e) {} }
  renderChat();
}
// the room is full (100) → no way in: cover the room with the notice and quietly check again now and then
const gateEl = $('#gate'), gateTitle = $('#gateTitle'), gateText = $('#gateText');
function roomFull(m){
  drop(1000);
  const cap = m && Number.isInteger(m.cap) && m.cap > 0 ? m.cap : 100;
  if (m && m.why === 'ip'){
    gateTitle.textContent = '지금은 들어갈 수 없어요';
    gateText.textContent = '같은 와이파이나 회사망에서 이미 많이 들어와 있어요.\n자리가 나면 자동으로 들어가요.';
  } else {
    gateTitle.textContent = '객장이 꽉 찼어요';
    gateText.textContent = '최대 ' + cap + '명까지 함께 볼 수 있어요.\n자리가 나면 자동으로 들어가요.';
  }
  if (!blocked){
    blocked = true; gateEl.hidden = false;
    keys.clear(); target = null; closeAvg(false);
    clearPeers(); setRoom('full'); closePeer(); chatInput.blur();
  }
  renderChat();
  scheduleRetry(FULL_RETRY_MS * (0.75 + Math.random() * 0.5));
}
function unblock(){
  if (!blocked) return;
  blocked = false; gateEl.hidden = true; markDirty();
  renderChat();
}
function onClosed(code){
  ws = null; myId = null; sent = null;
  renderChat();
  if (code === 4001){ roomFull(null); return; }
  lostRoom();
  scheduleRetry();
}
// keep the others standing for a short blip; clear them if the room doesn't come back
function lostRoom(){
  if (roomState === 'live') setRoom('connecting');
  armSolo();
  clearTimeout(clearT);
  clearT = setTimeout(() => { if (!isOpen()) clearPeers(); }, 15000);
}
function armSolo(){
  clearTimeout(soloT);
  soloT = setTimeout(() => { if (!isOpen() && roomState === 'connecting') setRoom('solo'); }, SOLO_AFTER_MS);
}
// 1s, 2s, 4s … up to 30s, with jitter so a server restart isn't hit by everyone at once
function scheduleRetry(ms){
  clearTimeout(retryT);
  if (paused) return;
  if (ms == null){ ms = Math.min(30000, 1000 * 2 ** Math.min(retryN, 5)) * (0.6 + Math.random() * 0.4); retryN++; }
  retryT = setTimeout(connect, ms);
}

setInterval(() => {
  if (!ws) return;
  if (Date.now() - lastHeard > DEAD_MS){ drop(4000); lostRoom(); scheduleRetry(); return; }
  if (ws.readyState === 1){ try { ws.send('ping'); } catch (e) {} }
}, PING_MS);
// a background tab gives its spot back after a while and comes back in when it is shown again
document.addEventListener('visibilitychange', () => {
  clearTimeout(hiddenT);
  if (document.hidden){
    hiddenT = setTimeout(() => {
      if (!document.hidden) return;
      paused = true; clearTimeout(retryT); drop(1000); clearPeers(); setRoom('connecting');
    }, HIDDEN_MS);
  } else if (paused){ paused = false; retryN = 0; connect(); }
  else if (ws && ws.readyState === 1 && Date.now() - lastHeard > 30000){
    // back from a phone's background: a socket can look open but be dead, so check it now instead of in 70s
    const before = lastHeard;
    try { ws.send('ping'); } catch (e) {}
    setTimeout(() => { if (ws && lastHeard === before){ drop(4000); lostRoom(); scheduleRetry(0); } }, 5000);
  }
});
window.addEventListener('pagehide', () => { paused = true; clearTimeout(retryT); drop(1000); });
window.addEventListener('pageshow', e => { if (e.persisted){ paused = false; retryN = 0; clearPeers(); setRoom('connecting'); connect(); } });
renderCount();
renderChat();
connect();

/* ------------------------------------------------------------------
   NPC: wanders the aisles slowly, pausing at corners (never sent to the room)
   ------------------------------------------------------------------ */
const NPC_NODES = [[0, -5.2], [7.3, -5.2], [-7.3, -5.2], [7.3, 5.6], [-7.3, 5.6], [0, 5.6], [0, 0], [7.5, 10], [-7.5, 10], [0, 10]];
const NPC_EDGES = [[1, 2, 6], [0, 3], [0, 4], [1, 5, 7], [2, 5, 8], [3, 4, 6, 9], [0, 5], [3, 9], [4, 9], [5, 7, 8]];
const NPC_SPEED = 0.75;
class Npc {
  constructor(av, node){ this.av = av; this.node = node; this.prev = -1; this.to = null; this.wait = 2 + Math.random() * 3; }
  update(dt, t){
    const av = this.av;
    if (this.to){
      const dx = this.to.x - av.x, dz = this.to.z - av.z, d = Math.hypot(dx, dz);
      if (d < 0.05){ av.x = this.to.x; av.z = this.to.z; this.to = null; this.wait = 1.5 + Math.random() * 4; av.speed = 0; }
      else {
        const sp = Math.min(NPC_SPEED, d / Math.max(dt, 1e-3));
        av.x += dx / d * sp * dt; av.z += dz / d * sp * dt;
        av.r = wrapA(angleLerp(av.r, Math.atan2(dx, dz), 1 - Math.exp(-dt * 8)));
        av.speed = sp;
      }
    } else {
      av.speed = 0; this.wait -= dt;
      if (this.wait <= 0){
        const opts = NPC_EDGES[this.node].filter(i => i !== this.prev), next = opts[(Math.random() * opts.length) | 0];
        this.prev = this.node; this.node = next;
        this.to = { x: NPC_NODES[next][0] + (Math.random() - 0.5) * 0.6, z: NPC_NODES[next][1] + (Math.random() - 0.5) * 0.6 };
      } else av.r = wrapA(angleLerp(av.r, Math.PI, 1 - Math.exp(-dt * 0.8)));   // idle: slowly turn to the board
    }
    av.update(dt, t);
  }
}
const npcs = [new Npc(new Avatar({ name: '동네 힙스터', color: 0, kind: 'hype', x: 7.3, z: 5.6, r: Math.PI }), 3)];
function updateNpcs(dt, t){ for (const n of npcs) n.update(dt, t); }

function updateOthers(dt, t){
  const k = 1 - Math.exp(-dt * 9);
  others.forEach(av => {
    const ox = av.x, oz = av.z;
    av.x += (av.tx - av.x) * k; av.z += (av.tz - av.z) * k;
    if (Math.hypot(av.tx - av.x, av.tz - av.z) < 0.01){ av.x = av.tx; av.z = av.tz; }
    av.r = wrapA(angleLerp(av.r, av.tr, 1 - Math.exp(-dt * 10)));
    const sp = Math.hypot(av.x - ox, av.z - oz) / Math.max(dt, 1e-3);
    av.speed += (sp - av.speed) * Math.min(1, dt * 8);
    av.update(dt, t);
  });
}

/* ------------------------------------------------------------------
   HUD + loop
   ------------------------------------------------------------------ */
const sr = $('#sr');
const glowTarget = new T.Color('#ffb547');
const lightBase = new T.Color('#ffd9a0');
let lastBoard = 0, lastSec = -1, lastSr = 0;
function refreshHud(){
  const vs = STOCKS.map(s => view(s));
  // 평단 chips turn red/blue as prices cross them
  player.setAvg(player.avg); others.forEach(av => av.setAvg(av.avg));
  if (!avgPanel.hidden && !avgPrice.value) avgPlaceholder();
  if (vs.some(v => v.p != null) && Date.now() - lastSr > 30000){
    lastSr = Date.now();
    sr.textContent = STOCKS.map((s, i) => vs[i].p == null ? '' : s.name + ' ' + won(vs[i].p) + '원' + (vs[i].pct != null ? ', 24시간 전 대비 ' + fmtPct(vs[i].pct) : '') + '.').join(' ');
  }
  // the room glows red when both are up, blue when both are down
  glowTarget.set(vs.every(v => v.dir === 'up') ? '#ff4d57' : vs.every(v => v.dir === 'down') ? '#3f8cff' : '#ffb547');
}

function resize(){
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.fov = baseFov(); camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

let lastT = performance.now();
function frame(now){
  // the room is full: the gate covers everything, so skip all drawing until we get in
  if (blocked){ lastT = now; requestAnimationFrame(frame); return; }
  // a slow first load can hand the first frame a timestamp from before the script finished: never step backwards
  const dt = Math.min(0.05, Math.max(0, (now - lastT) / 1000)); lastT = now;
  const t = now / 1000, sec = Math.floor(Date.now() / 1000);
  if (M.dirty && now - lastBoard > 120 || sec !== lastSec){
    M.dirty = false; lastBoard = now;
    drawBoard(); boardTex.needsUpdate = true;
    refreshHud();
  }
  if (sec !== lastSec){
    lastSec = sec;
    drawTicker(); tickerTex.needsUpdate = true;
    tickerTex.repeat.x = (TICKER.w / TICKER.h) / (tc.width / tc.height);
  }
  tickerTex.offset.x = (tickerTex.offset.x + dt * (reduceMotion ? 0.012 : 0.04)) % 1;
  glowMat.color.lerp(glowTarget, 1 - Math.exp(-dt * 2)); reflMat.color.copy(glowMat.color);
  boardLight.color.copy(lightBase).lerp(glowTarget, 0.35);

  updatePlayer(dt);
  player.update(dt, t);
  updateOthers(dt, t);
  updateNpcs(dt, t);
  updateCamera(dt);
  if (markerT > 0){ markerT = Math.max(0, markerT - dt * 1.4); marker.material.opacity = markerT * 0.9; marker.scale.setScalar(1 + (1 - markerT) * 0.4); }
  sendState(false);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// once the web fonts arrive, redraw everything that was painted with fallbacks
if (document.fonts && document.fonts.load){
  Promise.all([
    document.fonts.load('44px "DotGothic16"'),
    document.fonts.load('600 42px "IBM Plex Sans KR"', '개미'),
    document.fonts.load('700 54px "IBM Plex Sans KR"', '비트코인 이더리움'),
  ]).then(() => {
    markDirty(); lastSec = -1;
    buildSigns();
    player.setName(player.name, true); player.setAvg(player.avg, true);
    others.forEach(av => { av.setName(av.name, true); av.setAvg(av.avg, true); });
  }).catch(() => {});
}
})();
