name = "coinlive-chat"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://coinlive.kang88.io"
CHAT_WAIT_MS = "60000"

[durable_objects]
bindings = [{ name = "ROOM", class_name = "GaekjangRoom" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GaekjangRoom"]
